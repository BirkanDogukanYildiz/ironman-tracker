{% extends "base.html" %}
{% block title %}{{ code }} · {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="card">
  <div class="empty">
    <div class="empty__icon">{{ '🔍' if code == 404 else '⚠️' }}</div>
    <h3>{{ code }}</h3>
    <p class="muted">{{ message }}</p>
    <div class="actions" style="justify-content:center;margin-top:14px">
      <a class="btn btn--primary" href="{{ url_for('dashboard') }}">← Dashboard'a dön</a>
    </div>
  </div>
</div>
{% endblock %}
